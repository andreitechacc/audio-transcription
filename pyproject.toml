[project]
name = "transcription"
version = "0.2.0"
description = "Transcribe audio via the OpenAI speech-to-text API, splitting long or oversized files automatically"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=2.48",
    "python-dotenv>=1.0.1",
]

[project.scripts]
transcribe = "transcription.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.pytest.ini_options]
testpaths = ["tests"]
