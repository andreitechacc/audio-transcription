[project]
name = "transcription-whisper"
version = "0.1.0"
description = "CLI tool for transcribing audio files via the OpenAI Whisper API, with automatic compression/splitting for files over the 25 MB API limit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=2.48",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.scripts]
transcribe = "transcription_whisper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_whisper"]
