# Defaults for every run. Each of these can be overridden per run by a CLI
# flag (see `uv run transcribe --help`).
language = "en"

# Plain transcript. Speaker-labelled output is supported too — set
# model = "gpt-4o-transcribe-diarize" and response_format = "diarized_json" —
# but on a real multi-speaker recording it reported seven or more speakers
# where there were three, so it is not the default. See the README.
model = "gpt-4o-transcribe"
response_format = "json"

# The API limit is 25 MB; the margin covers container overhead. This is what
# actually decides whether a recording gets split.
max_size_mb = 24
# Audio is encoded to mono MP3 at this bitrate before being uploaded. At 64k,
# max_size_mb is reached at roughly 50 minutes of audio.
bitrate = "64k"

# An upper bound on one request, not a target. Every model also imposes its
# own hard per-request duration limit, and the stricter of the two always
# wins — so raising this past roughly 23 minutes has no effect. Lower it if
# you want shorter requests than the model would allow.
chunk_minutes = 45

# One request covering 45 minutes takes several minutes to come back, and the
# connection carries nothing while it waits. Too low a value here aborts a
# request that the API has already transcribed — and billed.
request_timeout_seconds = 900
